# Plane (Community Edition) — hardened, self-hosted, deployed from this repo.
#
# Vendored from makeplane/plane v1.4.2, deployments/cli/community/docker-compose.yml.
# Upstream's file is kept structurally intact — same anchors, same service names, same
# order — so a future release can be diffed against it rather than re-merged by hand.
# Everything this file adds is marked with a "# +" comment.
#
# Deploy: Portainer -> Stacks -> Add stack -> Repository, pointing at this repo.
# Stack environment variables are the ${...} values below; see README "Configuration".
#
# Network design (see README "Sealing the stack"):
#   plane-internal  internal: true — no route off the host. Every service sits here.
#   plane-edge      the ONLY way in: the proxy, reached by nginx on the other VM.
#                   Fixed subnet so the firewall rule that denies its egress is stable.
#   mcp-edge        the MCP bridge. Deliberately NOT sealed: attach_from_url downloads
#                   files on request. Separate subnet so it is firewalled separately.

x-db-env: &db-env
  PGHOST: ${PGHOST:-plane-db}
  PGDATABASE: ${PGDATABASE:-plane}
  POSTGRES_USER: ${POSTGRES_USER:-plane}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong value}   # + no weak default
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  PGDATA: ${PGDATA:-/var/lib/postgresql/data}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-plane-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?set a strong value}      # + no weak default
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?set a strong value}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set a strong value}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set a strong value}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN:-localhost}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  # + The CERT_* vars are deliberately NOT passed. The proxy image's Caddyfile reads
  # + "acme_ca {$CERT_ACME_CA:https://acme-v02.api.letsencrypt.org/directory}", and
  # + Caddy applies that default only when the variable is UNSET. Passing an empty
  # + string leaves a bare "acme_ca" with no argument: Caddyfile parse error, crash
  # + loop, no proxy. Setting them blank to suppress ACME does not work.
  # + What actually suppresses ACME is SITE_ADDRESS below.
  LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
  LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  # + ":80" is a port with no hostname, so Caddy serves plain HTTP and never requests
  # + a certificate. TLS terminates at nginx on the other VM. Do not put a hostname
  # + here: that turns on automatic HTTPS and Caddy will try to reach Let's Encrypt.
  # + The sealed plane-edge network is the backstop if it ever does.
  SITE_ADDRESS: ${SITE_ADDRESS:-:80}

x-mq-env: &mq-env
  RABBITMQ_HOST: ${RABBITMQ_HOST:-plane-mq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set a strong value}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?generate with openssl rand -hex 32}

x-app-env: &app-env
  WEB_URL: ${WEB_URL:-http://localhost}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
  USE_MINIO: ${USE_MINIO:-1}
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD}@plane-db/${POSTGRES_DB:-plane}}
  SECRET_KEY: ${SECRET_KEY:?generate with openssl rand -hex 32}
  AMQP_URL: ${AMQP_URL:-amqp://${RABBITMQ_USER:-plane}:${RABBITMQ_PASSWORD}@plane-mq:5672/${RABBITMQ_VHOST:-plane}}
  # + Upstream default is 60/minute, which a bulk import will exhaust in seconds.
  # + Raise it for a migration run, then put it back. See README "Rate limits".
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
  # + Left empty on purpose: these allowlists exist to let Plane's own webhooks reach
  # + private addresses, i.e. to punch through its SSRF guard. Nothing here needs that.
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}

services:
  web:
    image: makeplane/plane-frontend:${APP_RELEASE:-v1.4.2}   # + pinned, was "stable"
    restart: unless-stopped                                   # + survives a host reboot
    networks: [plane-internal]                                # +
    deploy:
      replicas: ${WEB_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - worker

  space:
    image: makeplane/plane-space:${APP_RELEASE:-v1.4.2}
    restart: unless-stopped
    networks: [plane-internal]
    deploy:
      replicas: ${SPACE_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - worker
      - web

  admin:
    image: makeplane/plane-admin:${APP_RELEASE:-v1.4.2}
    restart: unless-stopped
    networks: [plane-internal]
    deploy:
      replicas: ${ADMIN_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - web

  live:
    image: makeplane/plane-live:${APP_RELEASE:-v1.4.2}
    restart: unless-stopped
    networks: [plane-internal]
    environment:
      <<: [*live-env, *redis-env]
    deploy:
      replicas: ${LIVE_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - web

  api:
    image: makeplane/plane-backend:${APP_RELEASE:-v1.4.2}
    command: ./bin/docker-entrypoint-api.sh
    restart: unless-stopped
    networks: [plane-internal]
    deploy:
      replicas: ${API_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
      - logs_api:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq

  worker:
    image: makeplane/plane-backend:${APP_RELEASE:-v1.4.2}
    command: ./bin/docker-entrypoint-worker.sh
    restart: unless-stopped
    networks: [plane-internal]
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
      - logs_worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  beat-worker:
    image: makeplane/plane-backend:${APP_RELEASE:-v1.4.2}
    command: ./bin/docker-entrypoint-beat.sh
    restart: unless-stopped
    networks: [plane-internal]
    deploy:
      replicas: ${BEAT_WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
      - logs_beat-worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  migrator:
    image: makeplane/plane-backend:${APP_RELEASE:-v1.4.2}
    command: ./bin/docker-entrypoint-migrator.sh
    restart: "no"                                    # + runs once per deploy, then exits
    networks: [plane-internal]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - plane-db
      - plane-redis

  plane-db:
    image: postgres:15.7-alpine
    command: postgres -c 'max_connections=1000'
    restart: unless-stopped
    networks: [plane-internal]
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    networks: [plane-internal]
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    volumes:
      - redisdata:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    networks: [plane-internal]
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    # + Upstream uses ":latest". Pin MINIO_IMAGE to a dated tag before this matters.
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /export --console-address ":9090"
    restart: unless-stopped
    networks: [plane-internal]
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *minio-env
    volumes:
      - uploads:/export

  proxy:
    image: makeplane/plane-proxy:${APP_RELEASE:-v1.4.2}
    restart: unless-stopped
    # + The only service on the edge network, and the only published port. nginx on the
    # + other Proxmox VM talks to LISTEN_HTTP_PORT here; TLS is terminated there.
    networks: [plane-internal, plane-edge]
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *proxy-env
    ports:
      - target: 80
        published: ${LISTEN_HTTP_PORT:-80}
        protocol: tcp
        mode: host
      # + Upstream also publishes 443. Dropped: nginx terminates TLS, so binding 443
      # + here would only be a second, unmanaged TLS endpoint on the LAN.
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    depends_on:
      - web
      - api
      - space
      - admin
      - live

  plane-mcp:
    build:
      context: https://github.com/makeplane/plane-mcp-server.git
    restart: unless-stopped
    networks: [plane-internal, mcp-edge]
    depends_on:
      - api
    environment:
      # The official server (makeplane/plane-mcp-server) replaced the custom
      # bridge on 2026-09-18. 30 tools / 204 operations against the old 19, and
      # it is upstream-maintained rather than ours.
      #
      # Auth is per-person: each user presents their own Plane personal access
      # token as a bearer token at /http/api-key/mcp, so identity is correct by
      # construction and adding someone needs no redeploy and no shared secret.
      # This replaces MCP_PRINCIPALS, which was never populated.
      #
      # NOTE: MCP_BLOCK_DONE and MCP_ALLOW_DELETE have no equivalent upstream.
      # Closing and deleting are no longer refused in code. That rule now lives
      # in the plane-tickets skill as an agreement rather than an enforcement.
      #
      # LOG_PAYLOADS defaults to true upstream, which writes request payloads
      # (ticket contents) into container logs. Off deliberately.
      PLANE_BASE_URL: "https://plane.anythingamerica.com"
      PLANE_INTERNAL_BASE_URL: "http://api:8000"
      PLANE_WORKSPACE_SLUG: "${PLANE_WORKSPACE_SLUG:?the slug in /api/v1/workspaces/<slug>/}"
      LOG_PAYLOADS: "false"
    ports:
      - "${MCP_PORT_HOST:-8790}:8211"

volumes:
  pgdata:
  redisdata:
  uploads:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
  rabbitmq_data:
  proxy_config:
  proxy_data:

# + Upstream ships no networks block at all — every service lands on the default
# + bridge, which can reach the internet. This is the whole hardening story.
networks:
  plane-internal:
    driver: bridge
    internal: true          # no gateway: nothing here can reach anything off the host
    # + Pinned, like the other two. Left unpinned Docker allocates from its default
    # + 172.16-172.31 pool; on a host that already runs a dozen stacks that pool is
    # + nearly gone, and taking the last /16 makes the NEXT stack fail to deploy.
    ipam:
      config:
        - subnet: ${PLANE_INTERNAL_SUBNET:-192.168.242.0/24}
  plane-edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${PLANE_EDGE_SUBNET:-192.168.240.0/24}
  mcp-edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${MCP_EDGE_SUBNET:-192.168.241.0/24}
